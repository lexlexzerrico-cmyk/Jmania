<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0612" />
  <title>JERKMANIA — AI Clap Speed Arena</title>
  <meta name="description" content="JERKMANIA — the AI-powered clap speed arena. Clap as fast as you can, climb the ranks from Iron to Radiant, level up, and battle 1v1." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Animated background -->
  <div class="bg-layer">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- Top navigation / HUD -->
  <header class="topbar" id="topbar">
    <div class="brand" data-nav="lobby">
      <span class="brand-mark">
        <svg viewBox="0 0 44 44" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="bmg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff3d7f"/><stop offset="0.5" stop-color="#b14dff"/><stop offset="1" stop-color="#22e0d6"/>
            </linearGradient>
          </defs>
          <circle cx="22" cy="22" r="21" fill="url(#bmg)" opacity="0.18"/>
          <circle cx="22" cy="22" r="21" fill="none" stroke="url(#bmg)" stroke-width="2"/>
          <!-- left hand -->
          <path d="M17 30 L8 24 Q6 22 8 20 L15 24 L10 15 Q9 12 12 12 L18 22 Z" fill="url(#bmg)"/>
          <!-- right hand -->
          <path d="M27 30 L36 24 Q38 22 36 20 L29 24 L34 15 Q35 12 32 12 L26 22 Z" fill="url(#bmg)"/>
          <!-- lightning spark between -->
          <path d="M23 11 L19 22 L23 22 L20 33 L27 20 L23 20 Z" fill="#fff8c4" stroke="#ffd05a" stroke-width="0.6"/>
        </svg>
      </span>
      <span class="brand-name">JERK<span class="accent">MANIA</span></span>
    </div>

    <div class="profile-hud" id="profile-hud">
      <!-- filled by JS -->
    </div>
  </header>

  <main id="app" class="app">
    <!-- Screens are injected here by the router -->
  </main>

  <!-- Live webcam window -->
  <div class="cam-window hidden" id="cam-window">
    <video id="cam-video" autoplay playsinline muted></video>
    <span class="cam-badge"><i></i>LIVE</span>
    <span class="cam-label">YOU</span>
    <button class="cam-close" id="cam-close" title="Turn off camera" aria-label="Turn off camera">✕</button>
  </div>

  <!-- Camera toggle -->
  <button class="cam-toggle" id="cam-toggle" title="Toggle webcam" aria-label="Toggle webcam">
    <span class="cam-ic">📷</span>
    <span class="cam-txt">Cam</span>
  </button>

  <!-- Music control -->
  <button class="music-toggle" id="music-toggle" title="Toggle lobby music" aria-label="Toggle lobby music">
    <span class="music-icon">🎵</span>
    <span class="eq"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- Floating admin trigger + overlay panel (usable during matches) -->
  <button class="admin-fab hidden" id="admin-fab" title="Admin console" aria-label="Admin console">🛠️</button>
  <div class="admin-overlay hidden" id="admin-overlay"></div>

  <!-- Toast host -->
  <div class="toast-host" id="toast-host"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
